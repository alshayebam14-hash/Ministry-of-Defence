<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة وزارة الدفاع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131b2e;
            --bg-card-hover: #1a2642;
            --accent-gold: #d4af37;
            --accent-gold-hover: #f1c40f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-subtle: rgba(212, 175, 55, 0.2);
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--bg-card);
            border-bottom: 2px solid var(--accent-gold);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: var(--accent-gold);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .section-panel {
            display: none;
        }

        .section-panel.active {
            display: block;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.9rem;
        }

        th {
            background: rgba(212, 175, 55, 0.1);
            color: var(--accent-gold);
            font-weight: 700;
        }

        tr:hover {
            background: var(--bg-card-hover);
        }

        .badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-success { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge-rank { background: rgba(212, 175, 55, 0.15); color: var(--accent-gold); border: 1px solid var(--border-subtle); }
        .badge-code { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); }

        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-bar input, .search-bar select {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            flex: 1;
            min-width: 200px;
        }

        .search-bar input:focus, .search-bar select:focus {
            border-color: var(--accent-gold);
        }

        .btn-danger-sm {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .btn-danger-sm:hover {
            background: var(--danger);
            color: #fff;
        }

        .sotw-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .sotw-candidate-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            position: relative;
            transition: 0.3s;
        }

        .sotw-candidate-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-shield-halved"></i> لوحة إدارة وزارة الدفاع</h1>
        <div style="font-size: 0.9rem; color: var(--text-muted);" id="lastUpdateIndicator">جاري مزامنة البيانات...</div>
    </header>

    <div class="container">
        <!-- الأزرار التنقلية بين الأقسام -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('main', this)">الرئيسية (العام)</button>
            <button class="tab-btn" onclick="switchTab('records', this)">السجلات المرفقة</button>
            <button class="tab-btn" onclick="switchTab('operations', this)">العمليات (Pont)</button>
            <button class="tab-btn" onclick="switchTab('sotw', this)">عسكري الأسبوع</button>
            <button class="tab-btn" onclick="switchTab('courses', this)">الدورات والترقيات</button>
        </div>

        <!-- قسم الرئيسية -->
        <div id="mainSection" class="section-panel active">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="ابحث بالاسم، الأيدي، أو الكود..." oninput="filterTable()">
                <select id="categoryFilter" onchange="applyCategoryFilter()">
                    <option value="all">جميع الرتب والقطاعات</option>
                    <option value="officers">الضباط والقادة</option>
                    <option value="ncos">الأفراد والجنود</option>
                </select>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead id="tableHead">
                            <!-- سيتم تعبئته ديناميكياً -->
                        </thead>
                        <tbody id="tableBody">
                            <!-- بيانات الجدول -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- قسم السجلات -->
        <div id="recordsSection" class="section-panel">
            <div class="search-bar">
                <input type="text" id="searchRecId" placeholder="ابحث برقم الأيدي أو الاسم..." oninput="renderRecordsTable()">
                <select id="searchRecWeek" onchange="renderRecordsTable()">
                    <option value="الكل">جميع الأسابيع</option>
                    <option value="الأسبوع الأول">الأسبوع الأول</option>
                    <option value="الأسبوع الثاني">الأسبوع الثاني</option>
                    <option value="الأسبوع الثالث">الأسبوع الثالث</option>
                    <option value="الأسبوع الرابع">الأسبوع الرابع</option>
                </select>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table>
                        <tbody id="tableBodyRecords"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- قسم العمليات -->
        <div id="operationsSection" class="section-panel">
            <div class="search-bar">
                <input type="text" id="searchOpId" placeholder="ابحث برقم الأيدي أو الاسم..." oninput="renderOperationsTable()">
                <select id="searchOpWeek" onchange="renderOperationsTable()">
                    <option value="الكل">جميع الأسابيع</option>
                    <option value="الأسبوع الأول">الأسبوع الأول</option>
                    <option value="الأسبوع الثاني">الأسبوع الثاني</option>
                </select>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table>
                        <tbody id="tableBodyOperations"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- قسم عسكري الأسبوع -->
        <div id="sotwSection" class="section-panel">
            <div class="card" style="margin-bottom: 20px;">
                <h3 style="color: var(--accent-gold); margin-bottom: 10px;"><i class="fa-solid fa-crown"></i> المرشحين الأبرز لعسكري الأسبوع</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">يتم احتساب النقاط تلقائياً بناءً على مجموع السجلات والعمليات المرفقة لكل عسكري.</p>
            </div>
            <div class="sotw-grid" id="sotwCandidatesGrid">
                <!-- كروت المرشحين -->
            </div>
        </div>

        <!-- قسم الدورات -->
        <div id="coursesSection" class="section-panel">
            <div class="card">
                <h3 style="color: var(--accent-gold); margin-bottom: 15px;">متابعة الدورات العسكرية</h3>
                <div class="search-bar">
                    <input type="text" id="idSearchInput" placeholder="بحث سريع بالأيدي أو الاسم..." oninput="filterSoldiersDropdown()">
                    <select id="soldierSelect" onchange="renderSoldierCoursesDetails()">
                        <option value="">-- اختر عسكرياً --</option>
                    </select>
                </div>
                <div id="soldierCoursesContainer" style="margin-top: 20px;">
                    <p style="color: var(--text-muted); text-align: center;">الرجاء اختيار عسكري لعرض تفاصيل دوراته وسجله التدريبي.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // متغيرات البيانات العامة
        let rawSheetData = [];
        let attachedRecords = [];
        let attachedOperations = [];

        // التنقل بين الأقسام
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            btnElement.classList.add('active');

            if (tabName === 'main') {
                document.getElementById('mainSection').classList.add('active');
                applyCategoryFilter();
            } else if (tabName === 'records') {
                document.getElementById('recordsSection').classList.add('active');
                renderRecordsTable();
            } else if (tabName === 'operations') {
                document.getElementById('operationsSection').classList.add('active');
                renderOperationsTable();
            } else if (tabName === 'sotw') {
                document.getElementById('sotwSection').classList.add('active');
                renderSOTWCandidates();
            } else if (tabName === 'courses') {
                document.getElementById('coursesSection').classList.add('active');
            }
        }

        // دالة جلب البيانات الوهمية أو المربوطة بالشيت
        async function fetchAllData() {
            // بيانات تجريبية للتأكد من عمل العرض (يمكنك استبدالها برابط جلب الشيت الفعلي الخاص بك)
            rawSheetData = [
                { rank: 'لواء', name: 'سلطان القحطاني', idCard: '101', code: 'A-1', title: 'قائد القطاع', logs: '45', ads: '12', notes: 'لا يوجد', warnings: '0', lastPromotion: '2026/01/01', vacation: 'FALSE' },
                { rank: 'عميد', name: 'فهد العتيبي', idCard: '102', code: 'A-2', title: 'نائب القائد', logs: '38', ads: '10', notes: 'ممتاز', warnings: '0', lastPromotion: '2026/02/10', vacation: 'FALSE' },
                { rank: 'ملازم أول', name: 'محمد الشمري', idCard: '103', code: 'O-5', title: 'قائد SRT', logs: '50', ads: '15', notes: 'نشط جداً', warnings: '0', lastPromotion: '2026/05/12', vacation: 'TRUE' }
            ];

            attachedRecords = [
                { week: 'الأسبوع الأول', id: '101', name: 'سلطان القحطاني', rank: 'لواء', code: 'A-1', logs: '45', ads: '12' },
                { week: 'الأسبوع الأول', id: '103', name: 'محمد الشمري', rank: 'ملازم أول', code: 'O-5', logs: '50', ads: '15' }
            ];

            attachedOperations = [
                { week: 'الأسبوع الأول', id: '103', name: 'محمد الشمري', rank: 'ملازم أول', code: 'O-5', logs: '80' }
            ];

            document.getElementById('lastUpdateIndicator').innerText = 'تم التحديث بنجاح';
            applyCategoryFilter();
            populateSoldiersDropdown();
        }

        function applyCategoryFilter() {
            const category = document.getElementById('categoryFilter').value;
            let filtered = rawSheetData;
            
            if (category === 'officers') {
                filtered = rawSheetData.filter(item => ['لواء', 'عميد', 'عقيد', 'مقدم', 'رائد', 'نقيب', 'ملازم أول', 'ملازم'].includes(item.rank));
            } else if (category === 'ncos') {
                filtered = rawSheetData.filter(item => !['لواء', 'عميد', 'عقيد', 'مقدم', 'رائد', 'نقيب', 'ملازم أول', 'ملازم'].includes(item.rank));
            }
            renderMainTable(filtered);
        }

        function renderMainTable(data) {
            const head = document.getElementById('tableHead');
            head.innerHTML = `
                <tr>
                    <th>الرتبة</th>
                    <th>الاسم</th>
                    <th>الأيدي ID</th>
                    <th>الكود</th>
                    <th>المسمى الوظيفي</th>
                    <th>السجلات</th>
                    <th>الإعلانات</th>
                    <th>الملاحظات</th>
                    <th>التحذيرات</th>
                    <th>آخر ترقية</th>
                    <th>إجازة</th>
                </tr>
            `;

            const body = document.getElementById('tableBody');
            if (data.length === 0) {
                body.innerHTML = '<tr><td colspan="11" style="text-align: center; color: var(--text-muted);">لا توجد بيانات مطابقة للبحث</td></tr>';
                return;
            }

            let html = '';
            data.forEach(item => {
                let badgeClass = 'badge-success';
                let vacationText = 'على رأس العمل';
                if (item.vacation && item.vacation.toUpperCase() === 'TRUE') {
                    vacationText = 'في إجازة';
                    badgeClass = 'badge-danger';
                }

                html += `
                    <tr>
                        <td><span class="badge badge-rank">${item.rank}</span></td>
                        <td style="font-weight: 700;">${item.name}</td>
                        <td><span class="badge badge-code">${item.idCard}</span></td>
                        <td><span class="badge badge-code">${item.code}</span></td>
                        <td>${item.title}</td>
                        <td style="font-weight: 800; color: var(--accent-gold);">${item.logs}</td>
                        <td style="font-weight: 800;">${item.ads}</td>
                        <td>${item.notes}</td>
                        <td style="color: var(--warning);">${item.warnings}</td>
                        <td>${item.lastPromotion}</td>
                        <td><span class="badge ${badgeClass}">${vacationText}</span></td>
                    </tr>
                `;
            });
            body.innerHTML = html;
        }

        function renderRecordsTable() {
            const body = document.getElementById('tableBodyRecords');
            const weekFilter = document.getElementById('searchRecWeek').value;
            const textFilter = document.getElementById('searchRecId').value.toLowerCase();

            let filtered = attachedRecords;
            if (weekFilter !== 'الكل') {
                filtered = filtered.filter(item => item.week === weekFilter);
            }
            if (textFilter) {
                filtered = filtered.filter(item => item.id.toLowerCase().includes(textFilter) || item.name.toLowerCase().includes(textFilter));
            }

            if (filtered.length === 0) {
                body.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">لا توجد سجلات مرفقة مطابقة للبحث</td></tr>';
                return;
            }

            let html = `
                <tr>
                    <th>الأسبوع</th>
                    <th>رقم الأيدي ID</th>
                    <th>الاسم</th>
                    <th>الرتبة</th>
                    <th>الكود</th>
                    <th>السجلات</th>
                    <th>الإعلانات</th>
                    <th>إجراء</th>
                </tr>
            `;
            filtered.forEach(item => {
                html += `
                    <tr>
                        <td><span class="badge badge-rank">${item.week}</span></td>
                        <td><span class="badge badge-code">${item.id}</span></td>
                        <td style="font-weight: 700;">${item.name}</td>
                        <td>${item.rank}</td>
                        <td><span class="badge badge-code">${item.code}</span></td>
                        <td style="font-weight: 800; color: var(--accent-gold);">${item.logs}</td>
                        <td>${item.ads}</td>
                        <td>
                            <button class="btn-danger-sm" onclick="deleteRecordItem('${item.week}', '${item.id}')">
                                <i class="fa-solid fa-trash"></i> حذف
                            </button>
                        </td>
                    </tr>
                `;
            });
            body.innerHTML = html;
        }

        function renderOperationsTable() {
            const body = document.getElementById('tableBodyOperations');
            const weekFilter = document.getElementById('searchOpWeek').value;
            const textFilter = document.getElementById('searchOpId').value.toLowerCase();

            let filtered = attachedOperations;
            if (weekFilter !== 'الكل') {
                filtered = filtered.filter(item => item.week === weekFilter);
            }
            if (textFilter) {
                filtered = filtered.filter(item => item.id.toLowerCase().includes(textFilter) || item.name.toLowerCase().includes(textFilter));
            }

            if (filtered.length === 0) {
                body.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">لا توجد عمليات مرفقة مطابقة للبحث</td></tr>';
                return;
            }

            let html = `
                <tr>
                    <th>الأسبوع</th>
                    <th>رقم الأيدي ID</th>
                    <th>الاسم</th>
                    <th>الرتبة</th>
                    <th>الكود</th>
                    <th>نقاط العمليات (Pont)</th>
                    <th>إجراء</th>
                </tr>
            `;
            filtered.forEach(item => {
                html += `
                    <tr>
                        <td><span class="badge badge-rank">${item.week}</span></td>
                        <td><span class="badge badge-code">${item.id}</span></td>
                        <td style="font-weight: 700;">${item.name}</td>
                        <td>${item.rank}</td>
                        <td><span class="badge badge-code">${item.code}</span></td>
                        <td style="font-weight: 800; color: var(--accent-gold);">${item.logs}</td>
                        <td>
                            <button class="btn-danger-sm" onclick="deleteOperationItem('${item.week}', '${item.id}')">
                                <i class="fa-solid fa-trash"></i> حذف
                            </button>
                        </td>
                    </tr>
                `;
            });
            body.innerHTML = html;
        }

        function renderSOTWCandidates() {
            const grid = document.getElementById('sotwCandidatesGrid');
            let scores = {};
            
            attachedRecords.forEach(r => {
                if (!scores[r.id]) scores[r.id] = { id: r.id, name: r.name, rank: r.rank, code: r.code, total: 0 };
                scores[r.id].total += (parseInt(r.logs) || 0) + (parseInt(r.ads) || 0);
            });

            attachedOperations.forEach(o => {
                if (!scores[o.id]) {
                    const sol = rawSheetData.find(s => s.idCard === o.id);
                    scores[o.id] = { 
                        id: o.id, 
                        name: sol ? sol.name : o.name, 
                        rank: sol ? sol.rank : o.rank, 
                        code: sol ? sol.code : o.code, 
                        total: 0 
                    };
                }
                scores[o.id].total += (parseInt(o.logs) || 0);
            });

            let sorted = Object.values(scores).sort((a, b) => b.total - a.total).slice(0, 3);

            if (sorted.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">لا توجد بيانات كافية لاحتساب المرشحين لعسكري الأسبوع.</div>';
                return;
            }

            let html = '';
            sorted.forEach((cand, index) => {
                let crownColor = index === 0 ? 'var(--accent-gold)' : index === 1 ? '#c0c0c0' : '#cd7f32';
                html += `
                    <div class="sotw-candidate-card">
                        <div style="position: absolute; top: 15px; left: 15px; font-size: 1.5rem; color: ${crownColor};">
                            <i class="fa-solid fa-crown"></i>
                        </div>
                        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(212,175,55,0.1); display: flex; align-items: center; justify-content: center; color: var(--accent-gold); font-size: 1.5rem; border: 2px solid var(--accent-gold); margin: 0 auto 10px auto;">
                            <i class="fa-solid fa-user-shield"></i>
                        </div>
                        <h4 style="color: #fff; font-size: 1.1rem; font-weight: 800;">${cand.name}</h4>
                        <p style="color: var(--accent-gold); font-size: 0.85rem; font-weight: 700;">${cand.rank} - ${cand.code}</p>
                        <span class="badge badge-code">ID: ${cand.id}</span>
                        <div style="margin-top: 10px; width: 100%; background: #000; padding: 10px; border-radius: 8px; border: 1px solid var(--border-subtle);">
                            <span style="color: var(--text-muted); font-size: 0.8rem;">مجموع الإنجازات:</span>
                            <div style="font-size: 1.2rem; font-weight: 800; color: var(--accent-gold);">${cand.total} نقطة</div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                applyCategoryFilter();
                return;
            }

            let filtered = rawSheetData.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.idCard.toLowerCase().includes(query) || 
                item.code.toLowerCase().includes(query)
            );
            renderMainTable(filtered);
        }

        function populateSoldiersDropdown() {
            const select = document.getElementById('soldierSelect');
            if (!select) return;
            
            let html = '<option value="">-- اختر عسكرياً للاطلاع على دوراته --</option>';
            rawSheetData.forEach(s => {
                html += `<option value="${s.idCard}">${s.rank} / ${s.name} (ID: ${s.idCard})</option>`;
            });
            select.innerHTML = html;
        }

        function filterSoldiersDropdown() {
            const query = document.getElementById('idSearchInput').value.toLowerCase();
            const select = document.getElementById('soldierSelect');
            if (!select) return;

            let filtered = rawSheetData.filter(s => s.idCard.includes(query) || s.name.toLowerCase().includes(query));
            let html = '<option value="">-- اختر عسكرياً --</option>';
            filtered.forEach(s => {
                html += `<option value="${s.idCard}">${s.rank} / ${s.name} (ID: ${s.idCard})</option>`;
            });
            select.innerHTML = html;
        }

        function renderSoldierCoursesDetails() {
            const soldierId = document.getElementById('soldierSelect').value;
            const container = document.getElementById('soldierCoursesContainer');
            if (!soldierId) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">الرجاء اختيار عسكري لعرض تفاصيل دوراته وسجله التدريبي.</p>';
                return;
            }

            const soldier = rawSheetData.find(s => s.idCard === soldierId);
            container.innerHTML = `
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid var(--border-subtle);">
                    <h4 style="color: var(--accent-gold); margin-bottom: 5px;">${soldier.name} (${soldier.rank})</h4>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">رقم الأيدي: ${soldier.idCard} | الكود: ${soldier.code}</p>
                    <hr style="border: 0; border-top: 1px solid var(--border-subtle); margin: 10px 0;">
                    <p style="color: var(--success); font-size: 0.9rem;"><i class="fa-solid fa-circle-check"></i> اجتاز دورة التأمين الميداني والدورات الأساسية بنجاح.</p>
                </div>
            `;
        }

        window.onload = function() {
            fetchAllData();
        };
    </script>
</body>
</html>
