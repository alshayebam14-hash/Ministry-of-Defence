<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grave - لوحة التحكم التفاعلية</title>
    <style>
        body {
            background-color: #070a12;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #0e1422;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            color: #d4af37;
            margin-bottom: 10px;
        }
        p {
            color: #8a94a6;
            margin-bottom: 25px;
        }
        button {
            background-color: #d4af37;
            color: #070a12;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #f1c40f;
            transform: scale(1.05);
        }
        .counter {
            font-size: 2rem;
            color: #22c55e;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>لوحة تحكم Grave التفاعلية</h1>
        <p>هذي صفحة حية من الصفر، اضغط على الزر تحت عشان تتأكد إنها تستجيب معك!</p>
        <button onclick="increaseCount()">اضغط هنا للتجربة</button>
        <div class="counter" id="countDisplay">0</div>
    </div>

    <script>
        let clicks = 0;
        function increaseCount() {
            clicks++;
            document.getElementById('countDisplay').innerText = clicks;
        }
    </script>

</body>
</html>
